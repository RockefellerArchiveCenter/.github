name: Release Please

on:
  workflow_call:
    outputs:
      release_created:
        description: Whether Release Please created a release
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Created release tag
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Created release version
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: base