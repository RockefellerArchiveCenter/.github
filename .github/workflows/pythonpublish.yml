name: Release and Publish Python Package

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR or GitHub release
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: base

  publish:
    name: Build distribution and publish to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/${{ vars.PACKAGE_NAME }}/

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Check out released code
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: python3 -m pip install --user build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Attach source tarball to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/*.tar.gz \
            --clobber

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0