name: Check Branch

on:
  workflow_call:

jobs:
  check_branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Checking ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          if [[ "${BASE_BRANCH}" != "base" ]]; then
            echo "Target is not base; branch restriction does not apply."
            exit 0
          fi

          if [[ "${HEAD_BRANCH}" == "development" ]] || \
             [[ "${HEAD_BRANCH}" == release-please--branches* ]]; then
            echo "Allowed source branch: ${HEAD_BRANCH}"
            exit 0
          fi

          echo "ERROR: Only development or a Release Please branch for base may merge into base."
          exit 1