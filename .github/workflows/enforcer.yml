name: Check Branch
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate trunk-based pull request
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "base" && "$HEAD_BRANCH" == "development" ]]; then
            echo "::error::development is retired; open short-lived feature PRs against base"
            exit 1
          fi
          echo "Trunk PR branch policy passed"
