name: update dependencies

on:
  workflow_call:
    inputs:
      ruby-version:
        required: false
        type: string
        default: "3.4.1"
      node-version:
        required: false
        type: string
        default: "lts/*"

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: development

      - name: Detect dependency files
        id: detect
        shell: bash
        run: |
          [[ -f Gemfile ]] && echo "has_ruby=true" >> "$GITHUB_OUTPUT" || echo "has_ruby=false" >> "$GITHUB_OUTPUT"
          [[ -f package-lock.json ]] && echo "uses_npm=true" >> "$GITHUB_OUTPUT" || echo "uses_npm=false" >> "$GITHUB_OUTPUT"
          [[ -f yarn.lock ]] && echo "uses_yarn=true" >> "$GITHUB_OUTPUT" || echo "uses_yarn=false" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1.306.0
        if: steps.detect.outputs.has_ruby == 'true'
        with:
          ruby-version: ${{ inputs.ruby-version }}

      - name: Update Ruby dependencies
        if: steps.detect.outputs.has_ruby == 'true'
        run: bundle update --all && bundle install

      - uses: actions/setup-node@v6.4.0
        if: steps.detect.outputs.uses_npm == 'true' || steps.detect.outputs.uses_yarn == 'true'
        with:
          node-version: ${{ inputs.node-version }}

      - name: Update npm dependencies
        if: steps.detect.outputs.uses_npm == 'true'
        run: npm install && npm upgrade

      - name: Update yarn dependencies
        if: steps.detect.outputs.uses_yarn == 'true'
        run: yarn install && yarn upgrade

      - name: Run GitHub Actions Version Updater
        uses: saadmk11/github-actions-version-updater@v0.9.0
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          skip_pull_request: "true"

      - name: Create patch
        if: always()
        run: |
          git diff > changes.patch
          git apply --allow-empty "changes.patch"
      
      - name: Delete patch file
        if: always()
        run: rm -f changes.patch

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: dependency-updates
          title: "chore: Dependency Updates"
          commit-message: "chore: Scheduled dependency updates"