name: update python dependencies

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
    secrets:
      ACCESS_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "24"

      - name: Check dependency files
        id: files
        shell: bash
        run: |
          if [[ -f requirements.in ]]; then
            echo "has_requirements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_requirements=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f tests/test_requirements.in ]]; then
            echo "has_test_requirements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_requirements=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f test_requirements.in ]]; then
            echo "has_base_test_requirements=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base_test_requirements=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pre-commit, pip-tools, and actions-up
        run: |
          python -m pip install --upgrade "pip<26.2"
          python -m pip install pre-commit pip-tools
#          npm install -g actions-up

      - name: Run pre-commit autoupdate
        run: pre-commit autoupdate

#      - name: Update GitHub Actions versions
#        env:
#          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
#        run: actions-up --yes --style preserve

      - name: Update requirements
        if: steps.files.outputs.has_requirements == 'true'
        run: pip-compile --upgrade --no-header

      - name: Update test requirements
        if: steps.files.outputs.has_test_requirements == 'true'
        run: pip-compile --upgrade --no-header tests/test_requirements.in -o tests/test_requirements.txt

      - name: Update test requirements in base directory
        if: steps.files.outputs.has_base_test_requirements == 'true'
        run: pip-compile --upgrade --no-header test_requirements.in -o test_requirements.txt

      - name: Debug git state
        shell: bash
        run: |
          git status --short
          git diff --stat

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          base: development
          branch: dependency-updates
          title: "fix(deps): Scheduled dependency updates"
          commit-message: "fix(deps): Scheduled dependency updates"
          delete-branch: true