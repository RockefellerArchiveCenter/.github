name: Release Please

on:
  workflow_call:
    inputs:
      use-manifest:
        required: false
        type: boolean
        default: false
      release-type:
        required: false
        type: string
        default: simple

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release_simple
        if: ${{ !inputs.use-manifest }}
        uses: googleapis/release-please-action@v4.4.0
        with:
          release-type: ${{ inputs.release-type }}
          target-branch: base
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Run Release Please from manifest
        id: release_manifest
        if: ${{ inputs.use-manifest }}
        uses: googleapis/release-please-action@v4.4.0
        with:
          target-branch: base
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Normalize release outputs
        id: release
        if: always()
        run: |
          echo "release_created=${{ steps.release_simple.outputs.release_created || steps.release_manifest.outputs.release_created }}" >> "$GITHUB_OUTPUT"
          echo "releases_created=${{ steps.release_simple.outputs.releases_created || steps.release_manifest.outputs.releases_created }}" >> "$GITHUB_OUTPUT"
          echo "prs_created=${{ steps.release_simple.outputs.prs_created || steps.release_manifest.outputs.prs_created }}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${{ steps.release_simple.outputs.tag_name || steps.release_manifest.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.release_simple.outputs.version || steps.release_manifest.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "html_url=${{ steps.release_simple.outputs.html_url || steps.release_manifest.outputs.html_url }}" >> "$GITHUB_OUTPUT"

      - name: Output release info
        if: always()
        run: |
          echo "release_created=${{ steps.release.outputs.release_created }}"
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "tag_name=${{ steps.release.outputs.tag_name }}"
          echo "version=${{ steps.release.outputs.version }}"
          echo "html_url=${{ steps.release.outputs.html_url }}"

      - name: Check out released code
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Create application source archive
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          zip -r "${REPO_NAME}-${{ steps.release.outputs.tag_name }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "LICENSE" \
            -x "LICENSE.*" \
            -x "README" \
            -x "README.*" \
            -x "CHANGELOG" \
            -x "CHANGELOG.*" \
            -x "CODEOWNERS" \
            -x "CODE_OF_CONDUCT" \
            -x "CODE_OF_CONDUCT.*" \
            -x "CONTRIBUTING" \
            -x "CONTRIBUTING.*" \
            -x "SECURITY" \
            -x "SECURITY.*" \
            -x "SUPPORT" \
            -x "SUPPORT.*" \
            -x "FUNDING.yml" \
            -x ".release-please-manifest.json" \
            -x "release-please-config.json"

      - name: Upload application source archive to GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "${REPO_NAME}-${{ steps.release.outputs.tag_name }}.zip" \
            --clobber
