name: Automatic Release

on:
  push:
    branches:
      - base
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    uses: RockefellerArchiveCenter/.github/.github/workflows/pythonpublish.yml@base

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/${{ vars.PACKAGE_NAME }}/

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.x"

      - run: python3 -m pip install --user build

      - run: python3 -m build

      - name: Attach source tarball to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.tar.gz --clobber

      - uses: pypa/gh-action-pypi-publish@v1.13.0