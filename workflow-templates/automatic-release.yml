name: Release Please

on:
  push:
    branches:
      - base
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4.4.0
        with:
          target-branch: base
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        if: always()
        run: |
          echo "release_created=${{ steps.release.outputs.release_created }}"
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
          echo "tag_name=${{ steps.release.outputs.tag_name }}"
          echo "version=${{ steps.release.outputs.version }}"
          echo "html_url=${{ steps.release.outputs.html_url }}"

      - name: Check out released code
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Create application source archive
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          zip -r "${REPO_NAME}-${{ steps.release.outputs.tag_name }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "LICENSE" \
            -x "LICENSE.*" \
            -x "README" \
            -x "README.*" \
            -x "CHANGELOG" \
            -x "CHANGELOG.*" \
            -x "CODEOWNERS" \
            -x "CODE_OF_CONDUCT" \
            -x "CODE_OF_CONDUCT.*" \
            -x "CONTRIBUTING" \
            -x "CONTRIBUTING.*" \
            -x "SECURITY" \
            -x "SECURITY.*" \
            -x "SUPPORT" \
            -x "SUPPORT.*" \
            -x "FUNDING.yml" \
            -x ".release-please-manifest.json" \
            -x "release-please-config.json"

      - name: Upload application source archive to GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            "application-${{ steps.release.outputs.tag_name }}.zip" \
            --clobber
